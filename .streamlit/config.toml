[theme]
base = "light"
primaryColor = "#1c7ed6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6fb"
textColor = "#212529"
linkColor = "#1971c2"
borderColor = "#dee2e6"
baseRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap"
baseFontSize = 17
headingFontWeights = [700, 700, 600, 600, 600, 600]
blueColor = "#1c7ed6"
greenColor = "#2f9e44"
orangeColor = "#e8590c"
violetColor = "#ae3ec9"
redColor = "#e03131"
yellowColor = "#f08c00"
chartCategoricalColors = ["#1c7ed6", "#e8590c", "#2f9e44", "#ae3ec9", "#f08c00", "#d6336c", "#0ca678", "#495057"]

[theme.sidebar]
backgroundColor = "#eef4ff"
secondaryBackgroundColor = "#e0eaff"
textColor = "#1c2a4a"
borderColor = "#c9d8f5"

[server]
headless = true
